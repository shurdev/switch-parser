name: Build IPA with nxnative

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Base URL from Cloudflare Tunnel (e.g. https://xxx.trycloudflare.com)'
        required: true
        type: string

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout nxnative repository
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          submodules: recursive

      - name: Select latest Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang wget
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages nsz lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Setup prod.keys
        env:
          PROD_KEYS_CONTENT: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p ~/keys
          echo "$PROD_KEYS_CONTENT" > ~/keys/prod.keys

      - name: Download game files from local tunnel
        run: |
          mkdir -p "${{ github.workspace }}/game_input"
          cd "${{ github.workspace }}/game_input"
          # Download all game files with resume and max level 1 (ignore subfolder 404s)
          wget -c -r -np -nd -l 1 -A "*.nsp,*.nsz,*.xci" "${{ inputs.server_url }}/" || true
          ls -lh "${{ github.workspace }}/game_input"

      - name: Restore shader & profile cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/game_input/*_build/shader
            ${{ github.workspace }}/game_input/*_build/profile
          key: ${{ runner.os }}-shader-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-shader-cache-

      - name: Build IPA
        timeout-minutes: 320
        run: |
          python3 scripts/build_ipa_from_nsp.py "${{ github.workspace }}/game_input" -k ~/keys/prod.keys

      - name: Save shader & profile cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/game_input/*_build/shader
            ${{ github.workspace }}/game_input/*_build/profile
          key: ${{ runner.os }}-shader-cache-${{ github.run_id }}

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: "${{ github.workspace }}/game_input/*.ipa"
          if-no-files-found: ignore
          retention-days: 5
